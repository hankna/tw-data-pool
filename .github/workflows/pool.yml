name: pool
# 對帳式抓取：每次只補「已到預計公布時間、但還不是 ok」的項目。時間為台灣時間，cron 為 UTC。
# 下列 cron 是時刻表的唯一真相：clock.yml 照它準時送出 workflow_dispatch（slot＝cron 字串）。
# GitHub 自己的排程實測延遲 6～12 小時，保留只當備援。
on:
  schedule:
    - cron: "12 21 * * 1-5"   # 05:12 週二～六（夜盤收盤；順便重抓前一日關鍵項目偵測修訂）
    - cron: "2 22 * * 1-5"    # 06:02 週二～六（美股收盤）
    - cron: "32 22 * * 1-5"   # 06:32 週二～六
    - cron: "12 6 * * 1-5"    # 14:12 週一～五
    - cron: "22 7 * * 1-5"    # 15:22
    - cron: "17 8 * * 1-5"    # 16:17
    - cron: "32 9 * * 1-5"    # 17:32
    - cron: "22 13 * * 1-5"   # 21:22
    - cron: "52 13 * * 1-5"   # 21:52
  workflow_dispatch:
    inputs:
      date:    { description: "指定資料日 YYYY-MM-DD（留空＝現在）", required: false, default: "" }
      items:   { description: "只補這些項目，逗號分隔（留空＝全部）", required: false, default: "" }
      force:   { description: "強制重抓（true/false）", required: false, default: "false" }
      slot:    { description: "時鐘觸發的時段（cron 字串，或 catch-up）；手動留空", required: false, default: "" }
      slot_at: { description: "時鐘觸發的時段精確時間（ISO，台灣時間）；手動留空", required: false, default: "" }
concurrency:
  group: data-branch
  cancel-in-progress: false
  queue: max          # 排隊不互相取代：延遲到達的備援 cron 不會取消時鐘送出、正在排隊的時段
permissions:
  contents: write
  actions: read       # 備援檢查要讀 clock.yml 與 pool.yml 的執行狀態
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub 的排程只是備援：時鐘正常時（有時鐘在跑，且 6.5 小時內有時鐘送出的 pool 執行成功）就略過，
      # 避免延遲 6～12 小時才到的排程重複抓取、留下誤導的延遲紀錄。時鐘壞掉時兩個條件不成立，照常執行。
      - name: 備援檢查
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          live=$(gh run list --workflow clock.yml --status in_progress --json databaseId --jq length 2>/dev/null || echo 0)
          since=$(date -u -d '6 hours 30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          ok=$(gh run list --workflow pool.yml --event workflow_dispatch --status success --limit 20 \
                 --json createdAt --jq "[.[] | select(.createdAt >= \"$since\")] | length" 2>/dev/null || echo 0)
          echo "時鐘執行中 ${live} 個；6.5 小時內成功的 dispatch 執行 ${ok} 次"
          if [ "${live:-0}" -gt 0 ] && [ "${ok:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "時鐘正常，備援排程略過"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with: { ref: main, path: code }
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with: { ref: data, path: data }
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - name: 執行
        if: steps.gate.outputs.skip != 'true'
        working-directory: code
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_ITEMS: ${{ github.event.inputs.items }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_SLOT: ${{ github.event.inputs.slot }}
          IN_SLOT_AT: ${{ github.event.inputs.slot_at }}
        run: |
          # 時鐘觸發：trigger 記為 clock，時段沿用 cron 字串計算排程延遲
          [ -n "$IN_SLOT" ] && EVENT=clock
          [ -n "$IN_SLOT" ] && [ "$IN_SLOT" != "catch-up" ] && SCHED="$IN_SLOT"
          args=(--data-dir ../data --trigger "$EVENT")
          [ -n "$SCHED" ] && args+=(--cron "$SCHED")
          [ -n "$IN_SLOT" ] && [ -n "$IN_SLOT_AT" ] && args+=(--scheduled-for "$IN_SLOT_AT")
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ -n "$IN_ITEMS" ] && args+=(--items "$IN_ITEMS")
          [ "$IN_FORCE" = "true" ] && args+=(--force)
          [ "$SCHED" = "12 21 * * 1-5" ] && args+=(--recheck)
          python -m pool.run "${args[@]}"
      - name: 推送到 data 分支
        if: steps.gate.outputs.skip != 'true'
        working-directory: data
        run: |
          git config user.name "tw-data-pool[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "pool $(TZ=Asia/Taipei date +'%F %H:%M')" -q
          for i in 1 2 3; do git push origin HEAD:data && exit 0; git pull --rebase origin data; done
          exit 1
