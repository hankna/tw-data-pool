name: probe（建置前實測，一次性）
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: 實測（只記錄中繼資料，不記錄金鑰）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, re, time, datetime, urllib.request, urllib.parse, urllib.error
          from zoneinfo import ZoneInfo
          token = os.environ.get('FINMIND_TOKEN', '').strip()
          now = datetime.datetime.now(ZoneInfo('Asia/Taipei'))
          out = {'taipei_time': now.isoformat(), 'secret_present': bool(token), 'finmind': [], 'official': [], 'vix_page': {}}
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          def scrub(text):
              text = str(text)
              if token:
                  text = text.replace(token, '[REDACTED]')
              return re.sub(r'[A-Za-z0-9_.+=-]{40,}', '[REDACTED]', text)
          def get(url, headers=None, data=None, timeout=40, cap=12000000):
              h = {'User-Agent': UA}
              h.update(headers or {})
              t0 = time.time()
              req = urllib.request.Request(url, headers=h, data=data)
              try:
                  r = urllib.request.urlopen(req, timeout=timeout)
              except urllib.error.HTTPError as e:
                  r = e
              body = r.read(cap)
              return r.status, body, round(time.time() - t0, 2), r.headers.get('Content-Type', '')
          auth = {'Authorization': 'Bearer ' + token} if token else {}
          try:
              code, body, sec, _ = get('https://api.web.finmindtrade.com/v2/user_info', auth)
              info = json.loads(body)
              out['quota'] = {'http_status': code, 'used': info.get('user_count'), 'limit': info.get('api_request_limit'),
                              'level': info.get('level'), 'level_title': scrub(info.get('level_title', ''))[:30]}
          except Exception as e:
              out['quota'] = {'error_type': type(e).__name__}
          today = now.date()
          d10 = (today - datetime.timedelta(days=10)).isoformat()
          d4 = (today - datetime.timedelta(days=4)).isoformat()
          base = 'https://api.finmindtrade.com/api/v4/data'
          tests = [
              ('TaiwanStockTradingDate', '', d10), ('TaiwanStockPrice', 'TAIEX', d10), ('TaiwanStockPrice', 'TPEx', d10),
              ('TaiwanStockTotalInstitutionalInvestors', '', d10), ('TaiwanStockTotalMarginPurchaseShortSale', '', d10),
              ('TaiwanFuturesDaily', 'TX', d10), ('TaiwanOptionDaily', 'TXO', d4),
              ('TaiwanFuturesInstitutionalInvestors', 'TX', d10), ('TaiwanOptionInstitutionalInvestors', 'TXO', d10),
              ('TaiwanFuturesOpenInterestLargeTraders', 'TX', d10), ('TaiwanOptionOpenInterestLargeTraders', 'TXO', d10),
              ('TaiwanExchangeRate', 'USD', d10), ('TaiwanOptionVix', '', d10), ('TaiwanOptionVix', 'TXO', d10),
              ('TaiwanFutOptDailyInfo', '', d10),
              ('USStockPrice', '^GSPC', d10), ('USStockPrice', '^IXIC', d10), ('USStockPrice', '^DJI', d10),
              ('USStockPrice', '^SOX', d10), ('USStockPrice', '^VIX', d10), ('USStockPrice', 'TSM', d10), ('USStockPrice', 'NVDA', d10),
              ('GovernmentBondsYield', 'United States 10-Year', d10), ('GovernmentBondsYield', 'United States 2-Year', d10),
              ('CrudeOilPrices', 'Brent', d10), ('CrudeOilPrices', 'WTI', d10), ('GoldPrice', '', d4),
              ('TaiwanTotalExchangeMarginMaintenance', '', d10), ('CnnFearGreedIndex', '', d10),
          ]
          for ds, did, start in tests:
              p = {'dataset': ds, 'start_date': start, 'end_date': today.isoformat()}
              if did:
                  p['data_id'] = did
              r = {'dataset': ds, 'data_id': did}
              try:
                  code, body, sec, _ = get(base + '?' + urllib.parse.urlencode(p), auth)
                  payload = json.loads(body)
                  rows = payload.get('data') if isinstance(payload.get('data'), list) else []
                  dates = sorted({str(x.get('date', ''))[:10] for x in rows if isinstance(x, dict) and x.get('date')})
                  r.update(http_status=code, api_status=payload.get('status'), msg=scrub(payload.get('msg', ''))[:160],
                           rows=len(rows), bytes=len(body), seconds=sec, first_date=dates[0] if dates else None,
                           latest_date=dates[-1] if dates else None,
                           fields=sorted(rows[0].keys()) if rows and isinstance(rows[0], dict) else None)
                  if rows and 'trading_session' in rows[0]:
                      r['sessions'] = sorted({str(x.get('trading_session')) for x in rows})
                  if rows and 'contract_date' in rows[0]:
                      r['contract_dates_latest'] = sorted({str(x.get('contract_date')) for x in rows if str(x.get('date', ''))[:10] == dates[-1]})[:14]
                  if rows and 'name' in rows[0]:
                      r['names'] = sorted({str(x.get('name')) for x in rows})[:12]
                  if rows and 'institutional_investors' in rows[0]:
                      r['investors'] = sorted({str(x.get('institutional_investors')) for x in rows})[:12]
              except Exception as e:
                  r['error_type'] = type(e).__name__
              out['finmind'].append(r)
              time.sleep(0.4)
          D = '20261120'
          official = [
              ('TWSE MI_INDEX', f'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={D}&type=IND&response=json'),
              ('TWSE FMTQIK', f'https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date={D}&response=json'),
              ('TWSE BFI82U', f'https://www.twse.com.tw/rwd/zh/fund/BFI82U?type=day&dayDate={D}&response=json'),
              ('TWSE MI_MARGN', f'https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date={D}&selectType=MS&response=json'),
              ('TWSE openapi FMTQIK', 'https://openapi.twse.com.tw/v1/exchangeReport/FMTQIK'),
              ('TWSE openapi MI_INDEX', 'https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX'),
              ('TWSE openapi MI_MARGN', 'https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGN'),
              ('TPEx openapi index', 'https://www.tpex.org.tw/openapi/v1/tpex_index'),
              ('TAIFEX pcRatio', 'https://www.taifex.com.tw/cht/3/pcRatio'),
              ('TAIFEX futContractsDate', 'https://www.taifex.com.tw/cht/3/futContractsDate'),
              ('TAIFEX callsAndPutsDate', 'https://www.taifex.com.tw/cht/3/callsAndPutsDate'),
              ('TAIFEX largeTraderFutQry', 'https://www.taifex.com.tw/cht/3/largeTraderFutQry'),
              ('TAIFEX openapi PutCallRatio', 'https://openapi.taifex.com.tw/v1/PutCallRatio'),
              ('TAIFEX openapi swagger', 'https://openapi.taifex.com.tw/swagger.json'),
              ('TAIFEX mis VIX', 'https://mis.taifex.com.tw/futures/api/getQuoteListVIX'),
          ]
          for name, url in official:
              r = {'name': name}
              try:
                  code, body, sec, ctype = get(url, cap=3000000)
                  text = body.decode('utf-8', 'replace')
                  r.update(http_status=code, bytes=len(body), seconds=sec, content_type=ctype[:40], head=re.sub(r'\s+', ' ', text)[:160])
                  if 'swagger' in name:
                      try:
                          r['paths'] = sorted(json.loads(text).get('paths', {}).keys())[:120]
                      except Exception:
                          pass
              except Exception as e:
                  r['error_type'] = type(e).__name__
                  r['error'] = scrub(e)[:120]
              out['official'].append(r)
          for page in ('vixDaily3MNew', 'vixMinNew'):
              r = {}
              try:
                  code, body, sec, _ = get('https://www.taifex.com.tw/cht/7/' + page, cap=3000000)
                  text = body.decode('utf-8', 'replace')
                  r['http_status'] = code
                  r['tags'] = [re.sub(r'\s+', ' ', m)[:300] for m in re.findall(r'<(?:input|button|a)[^>]*(?:onclick|href)[^>]*>(?=[^<]{0,20}下載)|<(?:input|button)[^>]*下載[^>]*>', text)][:6]
                  r['vix_strings'] = sorted(set(re.findall(r'''[\w/.\-?=&:']*[Vv][Ii][Xx][\w/.\-?=&:']*''', text)))[:40]
                  r['scripts'] = [re.sub(r'\s+', ' ', m)[:400] for m in re.findall(r'function\s+\w*[Dd]own\w*\s*\([^)]*\)\s*\{[^}]*\}', text)][:4]
              except Exception as e:
                  r['error_type'] = type(e).__name__
              out['vix_page'][page] = r
          os.makedirs('logs', exist_ok=True)
          with open('logs/probe.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=1)
          print('done', len(out['finmind']), len(out['official']))
          PY
      - name: 寫回 data 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/probe.json
          git diff --cached --quiet || (git commit -m "probe 結果 [skip ci]" && git push)
